<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Collection — THREAD</title>
  <link rel="icon" type="image/png" href="images/TLogo.png" />
  <link rel="apple-touch-icon" href="images/TLogo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #161616;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --text2: #888;
      --accent: #6C63FF;
      --radius: 16px;
      --transition: all 0.2s ease;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Space Grotesk',sans-serif; min-height:100vh; }

    /* ── NAV ── */
    .nav { position:sticky; top:0; z-index:100; background:rgba(10,10,10,0.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:0 24px; height:64px; display:flex; align-items:center; justify-content:space-between; }
    .nav-logo { font-family:'Space Mono',monospace; font-size:18px; font-weight:700; color:var(--text); text-decoration:none; letter-spacing:2px; }
    .nav-logo span { color:var(--accent); }
    .nav-back { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; border-radius:50px; border:1px solid var(--border); background:transparent; color:var(--text2); font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:500; text-decoration:none; transition:var(--transition); }
    .nav-back:hover { border-color:var(--accent); color:var(--text); }

    /* ── HEADER ── */
    .page-header { padding:60px 24px 40px; max-width:1200px; margin:0 auto; }
    .page-tag { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:3px; color:var(--accent); text-transform:uppercase; margin-bottom:12px; }
    .page-title { font-size:clamp(32px,5vw,52px); font-weight:700; letter-spacing:-1px; line-height:1.1; margin-bottom:12px; }
    .page-title span { background:linear-gradient(135deg,#6C63FF,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .page-sub { color:var(--text2); font-size:16px; }

    /* ── FILTERS ── */
    .filters { max-width:1200px; margin:0 auto 36px; padding:0 24px; display:flex; gap:8px; flex-wrap:wrap; }
    .f-btn { padding:10px 24px; border-radius:50px; border:1px solid var(--border); background:transparent; color:var(--text2); font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:500; cursor:pointer; transition:var(--transition); }
    .f-btn.active, .f-btn:hover { background:var(--accent); border-color:var(--accent); color:#fff; }

    /* ── GRID ── */
    .catalog-grid { max-width:1200px; margin:0 auto; padding:0 24px 80px; display:grid; grid-template-columns:repeat(3,1fr); gap:28px; }
    @media(max-width:900px){ .catalog-grid { grid-template-columns:repeat(2,1fr); gap:20px; } }
    @media(max-width:560px){ .catalog-grid { grid-template-columns:1fr; gap:16px; } .page-header,.filters { padding:40px 16px 0; } .catalog-grid { padding:0 16px 60px; } }

    /* ── PRODUCT CARD ── */
    .cat-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition:var(--transition); }
    .cat-card:hover { transform:translateY(-6px); border-color:rgba(108,99,255,0.3); box-shadow:0 20px 50px rgba(0,0,0,0.4); }

    /* ── CAROUSEL ── */
    .carousel { position:relative; background:radial-gradient(ellipse at 60% 40%, #1a1a1a, #050505); aspect-ratio:1/1; overflow:hidden; }
    .carousel-track { display:flex; height:100%; transition:transform 0.35s cubic-bezier(0.4,0,0.2,1); }
    .carousel-slide { min-width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    .carousel-slide img { width:100%; height:100%; object-fit:contain; object-position:center; }

    .carousel-btn { position:absolute; top:50%; transform:translateY(-50%); width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.15); color:#fff; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:var(--transition); z-index:5; backdrop-filter:blur(4px); }
    .carousel-btn:hover { background:rgba(108,99,255,0.8); border-color:var(--accent); }
    .carousel-btn.prev { left:10px; }
    .carousel-btn.next { right:10px; }

    .carousel-dots { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:5px; z-index:5; }
    .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.35); cursor:pointer; transition:var(--transition); }
    .dot.active { background:#fff; transform:scale(1.3); }

    .product-badge { position:absolute; top:12px; left:12px; padding:5px 10px; border-radius:50px; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:1.5px; font-weight:700; text-transform:uppercase; z-index:4; }
    .badge-hot   { background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; }
    .badge-new   { background:linear-gradient(135deg,#6C63FF,#a78bfa); color:#fff; }
    .badge-ltd   { background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff; }
    .badge-tee   { background:linear-gradient(135deg,#10b981,#059669); color:#fff; }

    /* ── INFO ── */
    .cat-info { padding:16px 18px 18px; }
    .type-label { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); margin-bottom:4px; font-family:'Space Mono',monospace; }
    .cat-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px; }
    .cat-top h3 { font-size:16px; font-weight:600; }
    .earn-tag { font-size:11px; font-weight:600; padding:4px 10px; border-radius:50px; background:rgba(34,197,94,0.12); border:1px solid rgba(34,197,94,0.25); color:#22c55e; white-space:nowrap; }
    .cat-bottom { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .price { font-size:20px; font-weight:700; }
    .stars { font-size:12px; color:#f59e0b; }
    .stars span { color:var(--text2); font-size:11px; }
    .btn-cart { width:100%; padding:12px; border-radius:50px; background:#fff; color:#111; font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700; border:none; cursor:pointer; transition:var(--transition); }
    .btn-cart:hover { background:var(--accent); color:#fff; }
  </style>
</head>
<body>

  <!-- ─── CART OVERLAY + DRAWER ─── -->

  <div id="cartDrawer" style="position:fixed;top:0;right:-420px;width:400px;max-width:100vw;height:100vh;background:#111;z-index:999;transition:right 0.3s ease;display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,0.08);">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.08);">

      <button onclick="toggleCart()" style="background:none;border:none;color:#888;font-size:20px;cursor:pointer;">✕</button>
    </div>
    <div id="cdItems" style="flex:1;overflow-y:auto;padding:16px 24px;">
      <div class="cd-empty" style="text-align:center;padding:60px 0;color:#555;">
        <div style="font-size:40px;margin-bottom:12px;">🛍️</div>
        <p style="color:#888;">Your cart is empty</p>
        <p style="font-size:12px;color:#555;margin-top:4px;">Add a hoodie or tee to get started</p>
      </div>
    </div>
    <div id="cdFooter" style="display:none;padding:20px 24px;border-top:1px solid rgba(255,255,255,0.08);">
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <input type="text" id="promoInput" placeholder="Promo code" style="flex:1;padding:10px 14px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#f0f0f0;font-family:'Space Grotesk',sans-serif;font-size:13px;outline:none;" onkeydown="if(event.key==='Enter')applyPromo()" />
        <button onclick="applyPromo()" style="padding:10px 16px;background:#6C63FF;color:#fff;border:none;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;cursor:pointer;">Apply</button>
      </div>
      <div id="cdDiscountRow" style="display:none;justify-content:space-between;margin-bottom:8px;color:#22c55e;font-size:13px;"><span>Discount</span><span id="cdDiscount"></span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;color:#888;font-size:14px;"><span>Subtotal</span><span id="cdSubtotal">$0.00</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:16px;font-size:16px;font-weight:700;color:#f0f0f0;"><span>Total</span><span id="cdTotal">$0.00</span></div>
      <button onclick="goToCheckout()" style="display:block;width:100%;padding:14px;background:#6C63FF;color:#fff;text-align:center;border-radius:50px;font-weight:700;font-size:15px;border:none;cursor:pointer;">Checkout →</button>
    </div>
  </div>

  <div class="page-header">
    <div class="page-tag">THE COLLECTION</div>
    <h1 class="page-title">Every piece. <span>Every color.</span></h1>
    <p class="page-sub">Hoodies &amp; tees — all with your QR code permanently printed on the back.</p>
  </div>

    }

  function starStr(s) {
    const n = parseFloat(s);
    return '★'.repeat(Math.floor(n)) + (n % 1 >= 0.5 ? '½' : '');
  }

  function buildCard(p, idx) {
    const typeLabel = p.type === 'tee' ? '<div class="type-label">Oversized Tee</div>' : '<div class="type-label">Oversized Heavyweight</div>';
    const badge = p.badge
      ? `<div class="product-badge ${p.badge.cls}">${p.badge.text}</div>` : '';
    const dots = p.photos.map((_,i) =>
      `<div class="dot${i===0?' active':''}" data-idx="${i}"></div>`).join('');
    return `
      <div class="cat-card" data-type="${p.type}">
        <div class="carousel" data-card="${idx}">
          ${badge}
          <div class="carousel-track" id="track-${idx}">
            ${p.photos.map(src => `
              <div class="carousel-slide">
                <img src="${src}" alt="${p.name}" loading="lazy">
              </div>`).join('')}
          </div>
          ${p.photos.length > 1 ? `
          <button class="carousel-btn prev" onclick="slide(${idx},-1)">&#8249;</button>
          <button class="carousel-btn next" onclick="slide(${idx}, 1)">&#8250;</button>
          <div class="carousel-dots" id="dots-${idx}">${dots}</div>` : ''}
        </div>
        <div class="cat-info">
          ${typeLabel}
          <div class="cat-top">
            <h3>${p.name}</h3>
            <span class="earn-tag">Earn ${p.earn} per sale</span>
          </div>
          <div class="cat-bottom">
            <span class="price">$${p.price}</span>
            <div class="stars">${starStr(p.stars)} <span>${p.stars} (${p.reviews})</span></div>
          </div>
          <button class="btn-cart" onclick="addToCart('${p.name}', ${p.price}, this)">Add to Cart — $${p.price}</button>
        </div>
      </div>`;
  }

  /* ── RENDER ── */
  const grid = document.getElementById('catalogGrid');
  let currentFilter = 'all';
  const indices = {};  // track current slide per card

  function render() {
    const visible = PRODUCTS.filter(p => currentFilter === 'all' || p.type === currentFilter);
    grid.innerHTML = visible.map((p, i) => buildCard(p, i)).join('');
    visible.forEach((_, i) => { indices[i] = 0; });
    // wire dot clicks
    grid.querySelectorAll('.dot').forEach(dot => {
      dot.addEventListener('click', () => {
        const card = parseInt(dot.closest('.carousel').dataset.card);
        goTo(card, parseInt(dot.dataset.idx));
      });
    });
  }

  function slide(cardIdx, dir) {
    const track = document.getElementById('track-' + cardIdx);
    if (!track) return;
    const total = track.children.length;
    indices[cardIdx] = (indices[cardIdx] + dir + total) % total;
    goTo(cardIdx, indices[cardIdx]);
  }

  function goTo(cardIdx, idx) {
    indices[cardIdx] = idx;
    const track = document.getElementById('track-' + cardIdx);
    if (track) track.style.transform = `translateX(-${idx * 100}%)`;
    const dotsEl = document.getElementById('dots-' + cardIdx);
    if (dotsEl) {
      dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
    }
  }

  /* ── FILTER ── */
  document.querySelectorAll('.f-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  /* ── CART ── */
  const CART_KEY = 'thread_cart';
  function getCart() {
    try { const c = JSON.parse(localStorage.getItem(CART_KEY)); return c && c.items ? c : {items:[], discount:0}; }
    catch(e) { return {items:[], discount:0}; }
  }
  function saveCart(c) { localStorage.setItem(CART_KEY, JSON.stringify(c)); }

  function renderCartDrawer() {
    const cart = getCart();
    const total = cart.items.reduce((s,i) => s + i.price * (i.qty||1), 0);
    const count = cart.items.reduce((s,i) => s + (i.qty||1), 0);
    const countEl = document.getElementById('cartCount');
    const cdCount = document.getElementById('cdCount');
    const cdItems = document.getElementById('cdItems');
    const cdFooter = document.getElementById('cdFooter');
    if (countEl) { countEl.textContent = count; countEl.style.display = count ? 'flex' : 'none'; }
    if (cdCount) cdCount.textContent = count ? `(${count})` : '';
    if (!cdItems) return;
    if (!cart.items.length) {
      cdItems.innerHTML = '<div style="text-align:center;padding:60px 0;"><div style="font-size:40px;margin-bottom:12px;">🛍️</div><p style="color:#888;">Your cart is empty</p></div>';
      if (cdFooter) cdFooter.style.display = 'none';
      return;
    }
    cdItems.innerHTML = cart.items.map((item, idx) => {
      const isHoodie = (item.type || 'hoodie') !== 'tee';
      const typeLabel = isHoodie ? 'Oversized Heavyweight' : 'Oversized Tee';
      const slugMap = {'Phantom Black':'phantom-black','Midnight Navy':'midnight-navy','Ember Crimson':'ember-crimson','Forest Shadow':'forest-shadow','Ash Stone':'ash-stone','Ivory Pure':'ivory-pure','Silver Mist':'silver-mist','Bone':'bone','Tawny Dusk':'tawny-dusk','Clean White':'clean-white','Raw Stone':'raw-stone','Jet Black':'jet-black','Deep Navy':'deep-navy','Slate Grey':'slate-grey'};
      const slug = slugMap[item.name] || item.name.toLowerCase().replace(/\s+/g,'-');
      const imgSrc = isHoodie ? `hoodie-variants/${slug}-front.png?v=hoodie-20260517` : `images/tee-${slug}-2.png`;
      return `
      <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
        <img src="${imgSrc}" alt="${item.name}" style="width:54px;height:54px;object-fit:cover;object-position:center top;border-radius:8px;background:#111;flex-shrink:0;">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;color:#f0f0f0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.name}</div>
          <div style="font-size:11px;color:#6C63FF;margin-top:1px;font-weight:500;">${typeLabel}</div>
          <div style="font-size:11px;color:#888;margin-top:2px;">Size: ${item.size||'M'} · $${item.price}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
          <button onclick="updateQty(${idx},-1)" style="background:rgba(255,255,255,0.08);border:none;color:#f0f0f0;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:16px;">−</button>
          <span style="color:#f0f0f0;font-size:14px;min-width:14px;text-align:center;">${item.qty||1}</span>
          <button onclick="updateQty(${idx},1)" style="background:rgba(255,255,255,0.08);border:none;color:#f0f0f0;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:16px;">+</button>
          <button onclick="removeItem(${idx})" style="background:none;border:none;color:#555;cursor:pointer;font-size:14px;margin-left:2px;">✕</button>
        </div>
      </div>`;
    }).join('');
    if (cdFooter) cdFooter.style.display = 'block';
    const sub = document.getElementById('cdSubtotal'); if (sub) sub.textContent = '$'+total.toFixed(2);
    const tot = document.getElementById('cdTotal'); if (tot) tot.textContent = '$'+total.toFixed(2);
  }

  function updateQty(idx, delta) {
    const cart = getCart();
    cart.items[idx].qty = Math.max(1, (cart.items[idx].qty||1) + delta);
    saveCart(cart); renderCartDrawer();
  }
  function removeItem(idx) {
    const cart = getCart(); cart.items.splice(idx,1); saveCart(cart); renderCartDrawer();
  }

  function toggleCart() {
    const drawer = document.getElementById('cartDrawer');
    const overlay = document.getElementById('cartOverlay');
    const open = drawer.style.right === '0px';
    drawer.style.right = open ? '-420px' : '0px';
    overlay.style.display = open ? 'none' : 'block';
  }

  /* ── SIZE PICKER MODAL ── */
  function addToCart(name, price, btn) {
    const product = PRODUCTS.find(p => p.name === name);
    const type    = product ? product.type : 'hoodie';
    showSizePicker(name, price, type, btn);
  }

  function showSizePicker(name, price, type, btn) {
    const existing = document.getElementById('sizePickerModal');
    if (existing) existing.remove();

    const sizes = ['XS','S','M','L','XL','XXL'];
    const modal = document.createElement('div');
    modal.id = 'sizePickerModal';
    modal.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;`;
    modal.innerHTML = `
      <div style="background:#111;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:32px 28px;max-width:360px;width:100%;text-align:center;">
        <h3 style="font-size:18px;font-weight:700;margin-bottom:4px;">${name}</h3>
        <p style="font-size:13px;color:#888;margin-bottom:24px;">Select your size</p>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;">
          ${sizes.map(s => `
            <button onclick="confirmAddToCart('${name}',${price},'${type}','${s}')"
              style="padding:14px 8px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#f0f0f0;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;"
              onmouseover="this.style.background='#6C63FF';this.style.borderColor='#6C63FF';"
              onmouseout="this.style.background='#1a1a1a';this.style.borderColor='rgba(255,255,255,0.08)';">
              ${s}
            </button>`).join('')}
        </div>
        <button onclick="document.getElementById('sizePickerModal').remove()"
          style="width:100%;padding:12px;background:transparent;border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#888;font-family:'Space Grotesk',sans-serif;font-size:14px;cursor:pointer;">
          Cancel
        </button>
      </div>`;

    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
    // store btn ref to update after confirmation
    modal._btn = btn;
    modal._price = price;
  }

  function confirmAddToCart(name, price, type, size) {
    const modal = document.getElementById('sizePickerModal');
    const btn   = modal?._btn;
    modal?.remove();

    const cart = getCart();
    const existing = cart.items.find(i => i.name === name && i.size === size);
    if (existing) { existing.qty = (existing.qty||1) + 1; }
    else { cart.items.push({name, price:parseFloat(price), qty:1, size, type}); }
    saveCart(cart);
    renderCartDrawer();

    if (btn) {
      btn.textContent = `✓ Size ${size} Added!`;
      btn.style.background = '#22c55e';
      btn.style.color = '#fff';
      setTimeout(() => { btn.textContent = `Add to Cart — $${price}`; btn.style.background = ''; btn.style.color = ''; }, 1600);
    }
  }

  renderCartDrawer();

  function goToCheckout() {
    const cart = getCart();
    if (!cart.items.length) return;
    const subtotal = cart.items.reduce((s,i) => s + i.price * (i.qty||1), 0);
    const discount = cart.discount || 0;
    const total    = Math.max(0, subtotal - discount);
    localStorage.setItem('thread_checkout', JSON.stringify({
      items: cart.items, subtotal, discount, total,
      promoCode: cart.promoCode || '',
      ref: localStorage.getItem('thread_ref') || ''
    }));
    window.location.href = 'checkout.html';
  }

  /* ── TOUCH SWIPE ── */
  grid.addEventListener('touchstart', e => {
    const card = e.target.closest('.carousel');
    if (card) card._tx = e.touches[0].clientX;
  }, { passive:true });
  grid.addEventListener('touchend', e => {
    const card = e.target.closest('.carousel');
    if (!card || card._tx == null) return;
    const dx = e.changedTouches[0].clientX - card._tx;
    if (Math.abs(dx) > 40) {
      const idx = parseInt(card.dataset.card);
      slide(idx, dx < 0 ? 1 : -1);
    }
    card._tx = null;
  }, { passive:true });

  render();
  </script>
</body>
</html>
