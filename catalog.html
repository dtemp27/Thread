<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Collection — THREAD</title>
  <link rel="icon" type="image/png" href="images/TLogo.png" />
  <link rel="apple-touch-icon" href="images/TLogo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #161616;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --text2: #888;
      --accent: #6C63FF;
      --radius: 16px;
      --transition: all 0.2s ease;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Space Grotesk',sans-serif; min-height:100vh; }

    /* ── NAV ── */
    .nav { position:sticky; top:0; z-index:100; background:rgba(10,10,10,0.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:0 24px; height:64px; display:flex; align-items:center; justify-content:space-between; }
    .nav-logo { font-family:'Space Mono',monospace; font-size:18px; font-weight:700; color:var(--text); text-decoration:none; letter-spacing:2px; }
    .nav-logo span { color:var(--accent); }
    .nav-back { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; border-radius:50px; border:1px solid var(--border); background:transparent; color:var(--text2); font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:500; text-decoration:none; transition:var(--transition); }
    .nav-back:hover { border-color:var(--accent); color:var(--text); }

    /* ── HEADER ── */
    .page-header { padding:60px 24px 40px; max-width:1200px; margin:0 auto; }
    .page-tag { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:3px; color:var(--accent); text-transform:uppercase; margin-bottom:12px; }
    .page-title { font-size:clamp(32px,5vw,52px); font-weight:700; letter-spacing:-1px; line-height:1.1; margin-bottom:12px; }
    .page-title span { background:linear-gradient(135deg,#6C63FF,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .page-sub { color:var(--text2); font-size:16px; }

    /* ── FILTERS ── */
    .filters { max-width:1200px; margin:0 auto 36px; padding:0 24px; display:flex; gap:8px; flex-wrap:wrap; }
    .f-btn { padding:10px 24px; border-radius:50px; border:1px solid var(--border); background:transparent; color:var(--text2); font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:500; cursor:pointer; transition:var(--transition); }
    .f-btn.active, .f-btn:hover { background:var(--accent); border-color:var(--accent); color:#fff; }

    /* ── GRID ── */
    .catalog-grid { max-width:1200px; margin:0 auto; padding:0 24px 80px; display:grid; grid-template-columns:repeat(3,1fr); gap:28px; }
    @media(max-width:900px){ .catalog-grid { grid-template-columns:repeat(2,1fr); gap:20px; } }
    @media(max-width:560px){ .catalog-grid { grid-template-columns:1fr; gap:16px; } .page-header,.filters { padding:40px 16px 0; } .catalog-grid { padding:0 16px 60px; } }

    /* ── PRODUCT CARD ── */
    .cat-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition:var(--transition); }
    .cat-card:hover { transform:translateY(-6px); border-color:rgba(108,99,255,0.3); box-shadow:0 20px 50px rgba(0,0,0,0.4); }

    /* ── CAROUSEL ── */
    .carousel { position:relative; background:#fff; aspect-ratio:1/1; overflow:hidden; }
    .carousel-track { display:flex; height:100%; transition:transform 0.35s cubic-bezier(0.4,0,0.2,1); }
    .carousel-slide { min-width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    .carousel-slide img { width:100%; height:100%; object-fit:contain; object-position:center; }

    .carousel-btn { position:absolute; top:50%; transform:translateY(-50%); width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.15); color:#fff; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:var(--transition); z-index:5; backdrop-filter:blur(4px); }
    .carousel-btn:hover { background:rgba(108,99,255,0.8); border-color:var(--accent); }
    .carousel-btn.prev { left:10px; }
    .carousel-btn.next { right:10px; }

    .carousel-dots { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:5px; z-index:5; }
    .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.35); cursor:pointer; transition:var(--transition); }
    .dot.active { background:#fff; transform:scale(1.3); }

    .product-badge { position:absolute; top:12px; left:12px; padding:5px 10px; border-radius:50px; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:1.5px; font-weight:700; text-transform:uppercase; z-index:4; }
    .badge-hot   { background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; }
    .badge-new   { background:linear-gradient(135deg,#6C63FF,#a78bfa); color:#fff; }
    .badge-ltd   { background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff; }
    .badge-tee   { background:linear-gradient(135deg,#10b981,#059669); color:#fff; }

    /* ── INFO ── */
    .cat-info { padding:16px 18px 18px; }
    .type-label { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); margin-bottom:4px; font-family:'Space Mono',monospace; }
    .cat-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px; }
    .cat-top h3 { font-size:16px; font-weight:600; }
    .earn-tag { font-size:11px; font-weight:600; padding:4px 10px; border-radius:50px; background:rgba(34,197,94,0.12); border:1px solid rgba(34,197,94,0.25); color:#22c55e; white-space:nowrap; }
    .cat-bottom { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .price { font-size:20px; font-weight:700; }
    .stars { font-size:12px; color:#f59e0b; }
    .stars span { color:var(--text2); font-size:11px; }
    .btn-cart { width:100%; padding:12px; border-radius:50px; background:#fff; color:#111; font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700; border:none; cursor:pointer; transition:var(--transition); }
    .btn-cart:hover { background:var(--accent); color:#fff; }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">THREAD<span>.</span></a>
    <a href="index.html" class="nav-back">← Back to Home</a>
  </nav>

  <div class="page-header">
    <div class="page-tag">THE COLLECTION</div>
    <h1 class="page-title">Every piece. <span>Every color.</span></h1>
    <p class="page-sub">Hoodies &amp; tees — all with your QR code permanently printed on the back.</p>
  </div>

  <div class="filters">
    <button class="f-btn active" data-filter="all">All</button>
    <button class="f-btn" data-filter="hoodie">Hoodies</button>
    <button class="f-btn" data-filter="tee">Tees</button>
  </div>

  <div class="catalog-grid" id="catalogGrid"></div>

  <script>
  /* ── PRODUCT DATA ── */
  const PRODUCTS = [
    /* ── HOODIES ── */
    {
      type:'hoodie', name:'Phantom Black', price:89, earn:'20%',
      badge:{text:'🔥 BEST SELLER', cls:'badge-hot'},
      stars:'4.9', reviews:312,
      photos:['images/phantom-black-front.png','images/phantom-black-back.png']
    },
    {
      type:'hoodie', name:'Midnight Navy', price:89, earn:'20%',
      badge:{text:'NEW DROP', cls:'badge-new'},
      stars:'4.8', reviews:198,
      photos:['images/midnight-navy-front.png','images/midnight-navy-back.png']
    },
    {
      type:'hoodie', name:'Ember Crimson', price:89, earn:'20%',
      badge:{text:'LIMITED', cls:'badge-ltd'},
      stars:'5.0', reviews:87,
      photos:['images/ember-crimson-front.png','images/ember-crimson-back.png']
    },
    {
      type:'hoodie', name:'Forest Shadow', price:89, earn:'20%',
      badge:{text:'NEW DROP', cls:'badge-new'},
      stars:'4.7', reviews:143,
      photos:['images/forest-shadow-front.png','images/forest-shadow-back.png']
    },
    {
      type:'hoodie', name:'Ash Stone', price:89, earn:'20%',
      badge:null,
      stars:'4.6', reviews:224,
      photos:['images/ash-stone-front.png','images/ash-stone-back.png']
    },
    {
      type:'hoodie', name:'Ivory Pure', price:89, earn:'20%',
      badge:{text:'NEW DROP', cls:'badge-new'},
      stars:'4.9', reviews:8,
      photos:['images/ivory-pure-front.png','images/ivory-pure-back.png']
    },
    {
      type:'hoodie', name:'Silver Mist', price:89, earn:'20%',
      badge:{text:'NEW DROP', cls:'badge-new'},
      stars:'4.8', reviews:41,
      photos:['images/silver-mist-front.png','images/silver-mist-back.png']
    },
    {
      type:'hoodie', name:'Bone', price:89, earn:'20%',
      badge:{text:'NEW DROP', cls:'badge-new'},
      stars:'4.9', reviews:29,
      photos:['images/bone-front.png','images/bone-back.png']
    },
    {
      type:'hoodie', name:'Tawny Dusk', price:89, earn:'20%',
      badge:{text:'NEW DROP', cls:'badge-new'},
      stars:'4.7', reviews:17,
      photos:['images/tawny-dusk-front.png','images/tawny-dusk-back.png']
    },
    /* ── TEES ── */
    {
      type:'tee', name:'Jet Black', price:65, earn:'20%',
      badge:{text:'OVERSIZED TEE', cls:'badge-tee'},
      stars:'4.9', reviews:54,
      photos:['images/tee-jet-black-front.png','images/tee-jet-black-2.png','images/tee-jet-black-model.png','images/tee-jet-black-back.png','images/tee-jet-black-back-2.png']
    },
    {
      type:'tee', name:'Deep Navy', price:65, earn:'20%',
      badge:{text:'OVERSIZED TEE', cls:'badge-tee'},
      stars:'4.8', reviews:31,
      photos:['images/tee-deep-navy-front.png','images/tee-deep-navy-2.png','images/tee-deep-navy-model.png','images/tee-deep-navy-back.png','images/tee-deep-navy-back-2.png']
    },
    {
      type:'tee', name:'Slate Grey', price:65, earn:'20%',
      badge:{text:'OVERSIZED TEE', cls:'badge-tee'},
      stars:'4.7', reviews:28,
      photos:['images/tee-slate-grey-front.png','images/tee-slate-grey-2.png','images/tee-slate-grey-model.png','images/tee-slate-grey-back.png','images/tee-slate-grey-back-2.png']
    },
    {
      type:'tee', name:'Raw Stone', price:65, earn:'20%',
      badge:{text:'OVERSIZED TEE', cls:'badge-tee'},
      stars:'4.8', reviews:19,
      photos:['images/tee-raw-stone-front.png','images/tee-raw-stone-2.png','images/tee-raw-stone-model.png','images/tee-raw-stone-back.png','images/tee-raw-stone-back-2.png']
    },
    {
      type:'tee', name:'Clean White', price:65, earn:'20%',
      badge:{text:'OVERSIZED TEE', cls:'badge-tee'},
      stars:'4.9', reviews:22,
      photos:['images/tee-clean-white-front.png','images/tee-clean-white-2.png','images/tee-clean-white-model.png','images/tee-clean-white-back.png','images/tee-clean-white-back-2.png']
    }
  ];

  function starStr(s) {
    const n = parseFloat(s);
    return '★'.repeat(Math.floor(n)) + (n % 1 >= 0.5 ? '½' : '');
  }

  function buildCard(p, idx) {
    const typeLabel = p.type === 'tee' ? '<div class="type-label">Oversized Tee</div>' : '';
    const badge = p.badge
      ? `<div class="product-badge ${p.badge.cls}">${p.badge.text}</div>` : '';
    const dots = p.photos.map((_,i) =>
      `<div class="dot${i===0?' active':''}" data-idx="${i}"></div>`).join('');
    return `
      <div class="cat-card" data-type="${p.type}">
        <div class="carousel" data-card="${idx}">
          ${badge}
          <div class="carousel-track" id="track-${idx}">
            ${p.photos.map(src => `
              <div class="carousel-slide">
                <img src="${src}" alt="${p.name}" loading="lazy">
              </div>`).join('')}
          </div>
          ${p.photos.length > 1 ? `
          <button class="carousel-btn prev" onclick="slide(${idx},-1)">&#8249;</button>
          <button class="carousel-btn next" onclick="slide(${idx}, 1)">&#8250;</button>
          <div class="carousel-dots" id="dots-${idx}">${dots}</div>` : ''}
        </div>
        <div class="cat-info">
          ${typeLabel}
          <div class="cat-top">
            <h3>${p.name}</h3>
            <span class="earn-tag">Earn ${p.earn} per sale</span>
          </div>
          <div class="cat-bottom">
            <span class="price">$${p.price}</span>
            <div class="stars">${starStr(p.stars)} <span>${p.stars} (${p.reviews})</span></div>
          </div>
          <button class="btn-cart" onclick="addToCart('${p.name}', ${p.price})">Add to Cart — $${p.price}</button>
        </div>
      </div>`;
  }

  /* ── RENDER ── */
  const grid = document.getElementById('catalogGrid');
  let currentFilter = 'all';
  const indices = {};  // track current slide per card

  function render() {
    const visible = PRODUCTS.filter(p => currentFilter === 'all' || p.type === currentFilter);
    grid.innerHTML = visible.map((p, i) => buildCard(p, i)).join('');
    visible.forEach((_, i) => { indices[i] = 0; });
    // wire dot clicks
    grid.querySelectorAll('.dot').forEach(dot => {
      dot.addEventListener('click', () => {
        const card = parseInt(dot.closest('.carousel').dataset.card);
        goTo(card, parseInt(dot.dataset.idx));
      });
    });
  }

  function slide(cardIdx, dir) {
    const track = document.getElementById('track-' + cardIdx);
    if (!track) return;
    const total = track.children.length;
    indices[cardIdx] = (indices[cardIdx] + dir + total) % total;
    goTo(cardIdx, indices[cardIdx]);
  }

  function goTo(cardIdx, idx) {
    indices[cardIdx] = idx;
    const track = document.getElementById('track-' + cardIdx);
    if (track) track.style.transform = `translateX(-${idx * 100}%)`;
    const dotsEl = document.getElementById('dots-' + cardIdx);
    if (dotsEl) {
      dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
    }
  }

  /* ── FILTER ── */
  document.querySelectorAll('.f-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  /* ── CART ── */
  function addToCart(name, price) {
    const cart = JSON.parse(localStorage.getItem('thread_cart') || '[]');
    const existing = cart.find(i => i.name === name);
    if (existing) { existing.qty = (existing.qty || 1) + 1; }
    else { cart.push({ name, price, qty: 1 }); }
    localStorage.setItem('thread_cart', JSON.stringify(cart));
    window.dispatchEvent(new CustomEvent('cartUpdated'));
    // brief feedback
    event.target.textContent = '✓ Added!';
    event.target.style.background = '#22c55e';
    setTimeout(() => {
      event.target.textContent = `Add to Cart — $${price}`;
      event.target.style.background = '';
    }, 1400);
  }

  /* ── TOUCH SWIPE ── */
  grid.addEventListener('touchstart', e => {
    const card = e.target.closest('.carousel');
    if (card) card._tx = e.touches[0].clientX;
  }, { passive:true });
  grid.addEventListener('touchend', e => {
    const card = e.target.closest('.carousel');
    if (!card || card._tx == null) return;
    const dx = e.changedTouches[0].clientX - card._tx;
    if (Math.abs(dx) > 40) {
      const idx = parseInt(card.dataset.card);
      slide(idx, dx < 0 ? 1 : -1);
    }
    card._tx = null;
  }, { passive:true });

  render();
  </script>
</body>
</html>
