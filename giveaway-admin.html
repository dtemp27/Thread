<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THREAD — Giveaway Admin</title>
  <link rel="icon" href="favicon.ico?v=4" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <style>
    body { background: #080810; }

    /* ── Gate ── */
    .ga-gate {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .ga-gate-box {
      background: #0e0e18;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .ga-gate-logo { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
    .ga-gate-logo span { color: #7c3aed; }
    .ga-gate-sub  { font-size: 13px; color: #555; margin-bottom: 28px; }
    .ga-gate-box input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      padding: 13px 16px;
      color: #fff;
      font-size: 15px;
      font-family: 'Space Grotesk', sans-serif;
      outline: none;
      margin-bottom: 12px;
    }
    .ga-gate-box input:focus { border-color: #7c3aed; }
    .ga-gate-box button {
      width: 100%;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      cursor: pointer;
    }
    .ga-gate-box button:hover { background: #6d28d9; }
    .ga-error { color: #fca5a5; font-size: 13px; margin-top: 10px; min-height: 18px; }

    /* ── App shell ── */
    .ga-app { display: none; flex-direction: column; min-height: 100vh; }

    /* ── Top bar ── */
    .ga-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      background: #0e0e18;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .ga-topbar-left { display: flex; align-items: center; gap: 14px; }
    .ga-logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; color: #fff; text-decoration: none; }
    .ga-logo span { color: #7c3aed; }
    .ga-title-chip {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #a78bfa;
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 100px;
      padding: 4px 12px;
    }
    .ga-topbar-right { display: flex; align-items: center; gap: 10px; }
    .ga-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px;
      color: #ccc;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .ga-btn:hover   { background: rgba(255,255,255,0.10); color: #fff; }
    .ga-btn--purple { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .ga-btn--purple:hover { background: #6d28d9; }
    .ga-btn--red    { background: #7f1d1d; border-color: #7f1d1d; color: #fca5a5; }
    .ga-btn--red:hover { background: #991b1b; }

    /* ── Content ── */
    .ga-content { padding: 28px; max-width: 1100px; margin: 0 auto; width: 100%; }

    /* ── Stats row ── */
    .ga-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    .ga-stat {
      background: #0e0e18;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .ga-stat-label { font-size: 11px; font-weight: 600; color: #555; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 8px; }
    .ga-stat-value { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -1px; }

    /* ── Action bar ── */
    .ga-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    /* ── Table card ── */
    .ga-card {
      background: #0e0e18;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      overflow: hidden;
    }
    .ga-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .ga-card-header h2 { font-size: 16px; font-weight: 700; }
    .ga-refresh-hint   { font-size: 12px; color: #444; }

    /* ── Table ── */
    .ga-table-wrap { overflow-x: auto; }
    table.ga-table { width: 100%; border-collapse: collapse; }
    .ga-table th {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      text-align: left;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      white-space: nowrap;
    }
    .ga-table td {
      padding: 12px 14px;
      font-size: 13px;
      color: #ccc;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }
    .ga-table tr:last-child td { border-bottom: none; }
    .ga-table tr:hover td { background: rgba(255,255,255,0.02); }
    .ga-empty { text-align: center; color: #333; padding: 40px !important; font-size: 14px; }

    /* ── Winner modal ── */
    .ga-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 24px;
    }
    .ga-modal-overlay.open { display: flex; }
    .ga-modal {
      background: #0e0e18;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      animation: gaPopIn 0.3s ease both;
    }
    .ga-modal-icon { font-size: 56px; margin-bottom: 14px; }
    .ga-modal h2   { font-size: 24px; font-weight: 700; margin-bottom: 20px; }
    .ga-modal-name  { font-size: 22px; font-weight: 700; color: #a78bfa; margin-bottom: 6px; }
    .ga-modal-email { font-size: 14px; color: #888; margin-bottom: 4px; }
    .ga-modal-ig    { font-size: 15px; color: #e879f9; margin-bottom: 4px; }
    .ga-modal-prize { font-size: 13px; color: #fbbf24; margin-bottom: 24px; }
    .ga-modal-close {
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      cursor: pointer;
    }

    @keyframes gaPopIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 700px) {
      .ga-stats { grid-template-columns: 1fr 1fr; }
      .ga-topbar { padding: 14px 16px; }
      .ga-content { padding: 16px; }
      .ga-title-chip { display: none; }
    }
    @media (max-width: 420px) {
      .ga-stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ── GATE ── -->
  <div class="ga-gate" id="gaGate">
    <div class="ga-gate-box">
      <div class="ga-gate-logo">THREAD<span>.</span></div>
      <p class="ga-gate-sub">Giveaway Admin</p>
      <input type="password" id="gatePass" placeholder="Admin password"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter')gaCheckGate()" />
      <button onclick="gaCheckGate()">Enter →</button>
      <div class="ga-error" id="gaGateError"></div>
    </div>
  </div>

  <!-- ── APP ── -->
  <div class="ga-app" id="gaApp">

    <!-- Top bar -->
    <header class="ga-topbar">
      <div class="ga-topbar-left">
        <a href="index.html" class="ga-logo">THREAD<span>.</span></a>
        <span class="ga-title-chip">🎁 Giveaway Submissions</span>
      </div>
      <div class="ga-topbar-right">
        <button class="ga-btn" onclick="gaLoad()">↺ Refresh</button>
        <a href="giveaway.html" target="_blank" class="ga-btn">View Page ↗</a>
        <a href="admin.html" class="ga-btn">← Full Admin</a>
        <button class="ga-btn" onclick="gaSignOut()" style="color:#888">Sign Out</button>
      </div>
    </header>

    <!-- Content -->
    <div class="ga-content">

      <!-- Stats -->
      <div class="ga-stats">
        <div class="ga-stat">
          <div class="ga-stat-label">Total Entries</div>
          <div class="ga-stat-value" id="gaTotal">—</div>
        </div>
        <div class="ga-stat">
          <div class="ga-stat-label">Entries Today</div>
          <div class="ga-stat-value" id="gaToday">—</div>
        </div>
        <div class="ga-stat">
          <div class="ga-stat-label">Want Tees</div>
          <div class="ga-stat-value" id="gaTees">—</div>
        </div>
        <div class="ga-stat">
          <div class="ga-stat-label">Want Hoodie</div>
          <div class="ga-stat-value" id="gaHoodie">—</div>
        </div>
      </div>

      <!-- Actions -->
      <div class="ga-actions">
        <button class="ga-btn ga-btn--purple" onclick="gaPickWinner()">🎲 Pick Winner</button>
        <button class="ga-btn" onclick="gaExportCSV()">⬇ Export CSV</button>
        <button class="ga-btn ga-btn--red" onclick="gaClearAll()">🗑 Clear All Entries</button>
      </div>

      <!-- Table -->
      <div class="ga-card">
        <div class="ga-card-header">
          <h2>Submissions</h2>
          <span class="ga-refresh-hint" id="gaLastRefresh"></span>
        </div>
        <div class="ga-table-wrap">
          <table class="ga-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Instagram</th>
                <th>Prize</th>
                <th>Location</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="gaBody">
              <tr><td colspan="7" class="ga-empty">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div><!-- /content -->
  </div><!-- /app -->

  <!-- Winner modal -->
  <div class="ga-modal-overlay" id="gaWinnerModal" onclick="if(event.target===this)closeWinnerModal()">
    <div class="ga-modal">
      <div class="ga-modal-icon">🎉</div>
      <h2>Winner Selected!</h2>
      <div class="ga-modal-name"  id="gaWinnerName"></div>
      <div class="ga-modal-email" id="gaWinnerEmail"></div>
      <div class="ga-modal-ig"    id="gaWinnerIg"></div>
      <div class="ga-modal-prize" id="gaWinnerPrize"></div>
      <button class="ga-modal-close" onclick="closeWinnerModal()">Done</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="giveaway-admin.js?v=1"></script>

</body>
</html>
